<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Owner workspace | E-Vision India</title><link rel="stylesheet" href="/styles.css"><script src="/runtime-config.js" defer></script><script src="/owner.js" type="module"></script></head><body><header class="header"><a href="/" class="brand"><img src="/assets/evision-horizontal.png" alt="Evision" width="233" height="216"></a><span>PRIVATE OWNER WORKSPACE</span></header><main class="owner-wrap"><p id="notice" role="status"></p><form id="login" class="owner-card owner-login"><p class="eyebrow">E-VISION INDIA</p><h1>Owner sign-in</h1><label>Email<input type="email" name="email" autocomplete="username" required maxlength="254"></label><label>Password<input type="password" name="password" autocomplete="current-password" required maxlength="256"></label><button class="button">Sign in ↗</button></form><section id="dashboard" hidden><div class="section-heading"><div><p class="eyebrow">SALES WORKSPACE</p><h1>Conversations start here.</h1></div><button id="logout" class="button">Sign out</button></div><form id="filters" class="owner-toolbar"><label>Search<input name="q" placeholder="Name, company or email" maxlength="150"></label><label>Status<select name="status"><option value="">All statuses</option><option>new</option><option>contacted</option><option>qualified</option><option>closed</option></select></label><label>Sort<select name="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="name">Name A–Z</option></select></label><label>Submitted date<input type="date" name="day"></label><button class="button">Apply</button><button type="button" class="button" data-export="csv">CSV ↓</button><button type="button" class="button" data-export="xlsx">Excel ↓</button></form><p id="count"></p><div class="owner-card table-wrap"><table><thead><tr><th>Date</th><th>Name</th><th>Company</th><th>Interest</th><th>Status</th></tr></thead><tbody id="leads"></tbody></table></div><div class="owner-toolbar"><button id="previous" class="button">← Previous</button><span id="page"></span><button id="next" class="button">Next →</button></div><details open class="owner-card"><summary>Daily reports & integrations</summary><p id="integration-state"></p><form id="report-form" class="owner-toolbar"><label>Report date<input type="date" name="day" required></label><button class="button">Queue report / retry</button></form><div class="table-wrap"><table><thead><tr><th>Date</th><th>Delivery state</th><th>Attempts</th></tr></thead><tbody id="reports"></tbody></table></div><p>“Accepted” means email-provider acceptance, not confirmed inbox delivery.</p></details></section><dialog id="lead-dialog"><button id="close-dialog" class="button">Close</button><h2 id="lead-name"></h2><pre id="lead-detail"></pre><label>Status<select id="lead-status"><option>new</option><option>contacted</option><option>qualified</option><option>closed</option></select></label><button id="save-status" class="button">Save status</button><p id="detail-notice" role="status"></p></dialog></main></body></html>
